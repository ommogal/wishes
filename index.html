<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .card {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }

        h1 {
            color: #ff4081;
            font-size: 40px;
        }

        p {
            color: #555;
            font-size: 20px;
            line-height: 1.5;
        }

        button {
            border: none;
            padding: 14px 22px;
            margin: 8px 4px;
            border-radius: 30px;
            background: #ff4081;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #e91e63;
        }

        .music {
            margin-top: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="card">

        <div style="font-size: 60px;">🎂🎉🎈</div>

        <h1>HAPPY  BIRTHDAY 🎂</h1>

        <p id="message">
            Wishing you a very Happy Birthday! 🎉
            May your day be filled with happiness, laughter and lots of love. ❤️
        </p>

        <!-- Voice Button -->
        <!-- <button onclick="speakBirthday()">🎤 Voice Wish</button> -->

        <!-- Song Buttons -->
        <div class="music"><br>
            <!-- <p>🎵 Birthday Song</p> -->

            <button onclick="playSong()">▶️ Play Song</button>
            <button onclick="pauseSong()">⏸️ Pause</button>
        </div>

        <!-- Your song -->
        <audio id="birthdaySong" loop>
            <source
                src="AQMjSUXfNGpLN9VH0eLlNwrzdUQ6sjkixt3WG4fknCDkvKRaOynSAcAihaUtvEd6jfq_7LAZaCa6DBvmle63FUa_jbsu2HXUONMK4eU.mp3"
                type="audio/mpeg">
            Your browser does not support audio.
        </audio>

    </div>

    <script>
        // Voice wish
        function speakBirthday() {
            const message = document.getElementById("message").innerText;

            const speech = new SpeechSynthesisUtterance(message);
            speech.lang = "en-US";
            speech.rate = 0.9;
            speech.pitch = 1.1;

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(speech);
        }

        // Play song
        function playSong() {
            document.getElementById("birthdaySong").play();
        }

        // Pause song
        function pauseSong() {
            document.getElementById("birthdaySong").pause();
        }
    </script>

</body>

</html>
